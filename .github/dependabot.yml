version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Même délai que minimumReleaseAge (pnpm-workspace.yaml) : 7 jours avant de proposer une version.
    cooldown:
      default-days: 7
    versioning-strategy: increase
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
