# Configuration gitleaks : règles par défaut + données propres à ce projet.
#   gitleaks git --redact          (historique)
#   pnpm secrets:scan              (historique + fichiers non commités)

[extend]
useDefault = true

# Adresse de départ des trajets (donnée personnelle) : ne doit exister que dans
# ~/.config/csp-veille/.env. Toute valeur autre que l'exemple est signalée.
[[rules]]
id = "csp-origine-trajet"
description = "Adresse de départ (CSP_ORIGINE_TRAJET) hors du .env local"
regex = '''CSP_ORIGINE_TRAJET\s*=\s*["']?([^"'\n]{4,})'''
secretGroup = 1
keywords = ["csp_origine_trajet"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''adresse de départ''', '''process\.env''']

# Clé du fournisseur de résumés (Anthropic ou Albert) : uniquement dans ~/.config/csp-veille/.env.
# Les clés Anthropic (sk-ant-…) sont aussi couvertes par les règles par défaut ; le format des clés Albert ne l'est pas.
[[rules]]
id = "csp-llm-cle"
description = "Clé d'API du fournisseur de résumés (CSP_LLM_CLE) hors du .env local"
regex = '''CSP_LLM_CLE\s*=\s*["']?([A-Za-z0-9_\-.]{16,})'''
secretGroup = 1
keywords = ["csp_llm_cle"]
[[rules.allowlists]]
regexTarget = "match"
regexes = ['''(?i)test|exemple''']

[allowlist]
description = "Fichiers sans secret réel"
paths = ['''(^|/)pnpm-lock\.yaml$''']
