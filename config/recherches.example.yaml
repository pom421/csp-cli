# À copier dans ~/.config/csp-cli/recherches.yaml et adapter.
# Les valeurs lisibles (A, FPE, titulaire…) sont traduites en identifiants du site par le code.
recherches:
  - nom: numerique-orleans
    mots_cles: ['chef de projet numérique']
    # La recherche du site est large (« react » ramène « réactivité ») : mots_exacts ne garde que les offres où un
    # mot-clé figure en mots entiers (titre ou texte). En --dry-run, seul le titre est vérifié.
    mots_exacts: true
    # Filtrés par le site.
    localisation: { departements: ['45', '41'] }
    # Point de départ des trajets : lieu (« Gare d'Austerlitz », « Gare de Lyon (75) » pour lever une ambiguïté),
    # adresse, ou « lat,lon ». csp doctor affiche le lieu retenu.
    depart: "Gare d'Orléans"
    teletravail: true
    categories: [A]
    versants: [FPE, FPT]
    type_contrat: [titulaire, contractuel]
